<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>RPC Toolkit JS Client - Browser Module Example</title>
    <style>
      body {
        color: #111827;
        font-family: system-ui, sans-serif;
        line-height: 1.5;
        margin: 2rem;
        max-width: 760px;
      }

      label,
      input,
      button {
        display: block;
        font: inherit;
      }

      input {
        box-sizing: border-box;
        margin: 0.25rem 0 0.75rem;
        padding: 0.5rem;
        width: 100%;
      }

      button {
        padding: 0.5rem 0.75rem;
      }

      pre {
        background: #f3f4f6;
        overflow: auto;
        padding: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>Browser Module Example</h1>

    <label for="endpoint">RPC endpoint</label>
    <input id="endpoint" value="/rpc">
    <button id="run">Run checks</button>

    <pre id="output">Ready.</pre>

    <script type="module">
      import { RpcError, RpcSafeClient } from '../dist/rpc-client.mjs';

      const endpointInput = document.querySelector('#endpoint');
      const output = document.querySelector('#output');

      document.querySelector('#run').addEventListener('click', async () => {
        output.textContent = 'Running...';

        try {
          const client = new RpcSafeClient(endpointInput.value);
          const ping = await client.call('ping');
          const echo = await client.call('echo', {
            safePrefix: 'S:literal',
            datePrefix: 'D:literal',
            bigintLikeString: '9007199254740993n',
          });
          const types = await client.call('types');

          try {
            await client.call('domainError');
          } catch (error) {
            if (!(error instanceof RpcError)) {
              throw error;
            }

            output.textContent = stringify(
              {
                ping,
                echo,
                types: {
                  plain: types.plain,
                  dateValue: types.dateValue,
                  bigintValue: types.bigintValue.toString(),
                },
                domainError: {
                  code: error.code,
                  message: error.message,
                  data: error.data,
                },
              },
            );
          }
        } catch (error) {
          output.textContent = `${error.name}: ${error.message}`;
        }
      });

      function stringify(value) {
        return JSON.stringify(
          value,
          (_key, item) => (typeof item === 'bigint' ? item.toString() : item),
          2
        );
      }
    </script>
  </body>
</html>
